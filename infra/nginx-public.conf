worker_processes auto;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Only the Caddy container may assert the client address.
    set_real_ip_from 172.28.197.2;
    real_ip_header X-Real-IP;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
    limit_req_status 429;
    client_max_body_size 6m;
    server {
        listen 8080;
        set $backend http://backend:8000;
        set $frontend http://frontend:3000;
        location ^~ /api/admin/ {
            limit_req zone=admin burst=15 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass $backend$request_uri;
        }
        location ^~ /api/ {
            limit_req zone=public_api burst=30 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass $backend$request_uri;
        }
        location ^~ /out/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass $backend$request_uri;
        }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass $frontend$request_uri;
        }
    }
}
