name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Match lockfile npm version
        run: npm install --global npm@11.2.0
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build static site
        working-directory: frontend
        env:
          EXPORT_STATIC: "1"
          API_BASE_URL: https://api.inu-apps.ru
          PUBLIC_API_URL: https://api.inu-apps.ru
          PUBLIC_API_ENABLED: "true"
          PUBLIC_DEMO_FALLBACK: "false"
          PUBLIC_INDEXABLE: "false"
          PUBLIC_SITE_URL: https://rybakov1.github.io
          PUBLIC_SITE_NAME: Ценоскоп
        run: npm run build
      - name: Keep asset folders
        run: touch frontend/dist/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
