name: cenoscope-public
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cenoscope
      POSTGRES_USER: cenoscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.public}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cenoscope -d cenoscope"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cenoscope:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.public}@db:5432/cenoscope
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env.public}
      DEMO_MODE: 'false'
      COLLECTOR_ENABLED: 'false'
      PUBLIC_BASE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
      CORS_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
    networks: [app]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        PUBLIC_API_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
        PUBLIC_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
        PUBLIC_SITE_NAME: Ценоскоп
        PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      PUBLIC_API_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
      PUBLIC_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
      PUBLIC_DEMO_FALLBACK: 'false'
      PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
    networks: [app]
    depends_on:
      backend: {condition: service_healthy}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx-public.conf:/etc/nginx/nginx.conf:ro
    networks: [app, edge]
    depends_on: [backend, frontend]

  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.public}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.28.197.2
    depends_on: [gateway]

networks:
  app:
  edge:
    ipam:
      config:
        - subnet: 172.28.197.0/24
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
