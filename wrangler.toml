# Git build on Cloudflare runs `npx wrangler deploy`.
# The Worker name must match the connected project (rybakov1/rybakov1.github.io).
name = "rybakov1-github-io"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# auto-trailing-slash redirects with a 307, which does not consolidate the URL.
# "none" removes that redirect. The Worker 301s slashless routes and fetches
# page/index.html for the slashed URL, which "none" will not do by itself.
html_handling = "none"
run_worker_first = true

[vars]
LEAD_TO_EMAIL = "info@brijnco.com"
LEAD_CC_EMAIL = "support.inuapps@gmail.com"
LEAD_FROM_EMAIL = "AU Trade Shows <briefs@autradeshows.com>"
